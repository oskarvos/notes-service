server:
  port: 8080

spring:
  application:
    name: notes-service

  datasource:
    url: jdbc:h2:mem:notesdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    root: INFO
    com.oskarvos.notesservice: DEBUG